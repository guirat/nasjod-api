version: '3.8'

services:
  db:
    image: postgis/postgis:latest
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    env_file:
      - ./envs/db.env

  app:
    container_name: appnasjod
    build: .
    volumes:
      - ./nasjod:/app
      - static_volume:/vol/web
    ports:
      - "9000:9000"
    depends_on:
      - db
    env_file:
      - ./envs/app.env
    environment:
      # used only by `manage.py import_staged_mosques` (reads/updates staging; never written by discovery to main)
      STAGING_DATABASE_URL: ${STAGING_DATABASE_URL:-}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  mawaqit_api:
    # Build from pinned commit of mrsofiane/mawaqit-api
    build:
      context: https://github.com/mrsofiane/mawaqit-api.git#d173a5a5bf543d90777eff06d872819839b83681
    environment:
      ENABLE_AUTH: "true"
      BEARER_TOKEN: ${MAWAQIT_API_TOKEN:?MAWAQIT_API_TOKEN is required}
      ENABLE_REDIS: "true"
      REDIS_URI: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  discovery:
    build: ./mosque_discovery
    depends_on:
      - mawaqit_api
    environment:
      STAGING_DATABASE_URL: ${STAGING_DATABASE_URL:?STAGING_DATABASE_URL is required}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      MAWAQIT_API_URL: http://mawaqit_api
      MAWAQIT_API_TOKEN: ${MAWAQIT_API_TOKEN:?MAWAQIT_API_TOKEN is required}
    restart: "no"

volumes:
  postgres_data_prod:
  redis_data:
