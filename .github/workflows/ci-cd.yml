# GUI-2: build/push/deploy lives in deploy.yml, checks in ci.yml.
# This workflow only tags the merge commit and creates a GitHub Release.
# It never pushes to a branch (no version.txt commit), so branch protection needs no bypass.
name: Release (tag only)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Fetch all tags
          persist-credentials: false

      - name: Install semver
        run: pip install semver

      - name: Compute next version from latest tag
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          CURRENT_VERSION=${LAST_TAG#v}
          CURRENT_VERSION=${CURRENT_VERSION:-0.0.0}
          echo "Current version: $CURRENT_VERSION"

          if [[ "$COMMIT_MESSAGE" =~ feat! ]]; then
            VERSION_TYPE=major
          elif [[ "$COMMIT_MESSAGE" =~ feat ]]; then
            VERSION_TYPE=minor
          else
            VERSION_TYPE=patch
          fi
          echo "Version bump type: $VERSION_TYPE"

          NEW_VERSION=$(CURRENT_VERSION="$CURRENT_VERSION" VERSION_TYPE="$VERSION_TYPE" python3 -c "import os, semver; print(getattr(semver.VersionInfo.parse(os.environ['CURRENT_VERSION']), 'bump_' + os.environ['VERSION_TYPE'])())")
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Creates the tag on the merge commit via the API and the release in one step.
      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.version.outputs.new_version }}"
          target_commitish: ${{ github.sha }}
          name: "v${{ steps.version.outputs.new_version }}"
          body: "Automated release for version v${{ steps.version.outputs.new_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
