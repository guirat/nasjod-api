name: Deploy

# staging branch -> Environment "staging"; main branch -> Environment "production"
# (required reviewer gate configured by the owner on the GitHub Environment).
# workflow_dispatch = rollback: re-tag an existing SHA image as the env tag and redeploy.
on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Full 40-char commit SHA of an already-built image to redeploy (rollback). Run from the branch of the target environment."
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DISCOVERY_IMAGE: ghcr.io/${{ github.repository }}/nasjod-discovery

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      env_tag: ${{ steps.vars.outputs.env_tag }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Compute tags
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          case "$REF_NAME" in
            staging) env_tag=staging ;;
            main) env_tag=prod ;;
            *) echo "Refusing to deploy from branch $REF_NAME"; exit 1 ;;
          esac
          sha="$COMMIT_SHA"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! printf '%s' "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "rollback_sha must be a full 40-char lowercase hex SHA"; exit 1
            fi
            sha="$ROLLBACK_SHA"
          fi
          echo "env_tag=$env_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out code
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Immutable tag only. Moving tags (staging/prod/latest) are set in the gated deploy job.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push discovery image
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: mosque_discovery
          file: mosque_discovery/Dockerfile
          push: true
          # Immutable tag only. Moving tags are set in the gated deploy job.
          tags: ${{ env.DISCOVERY_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs only after the environment gate. Fails if the :<sha> image does not exist.
      # Also serves as the rollback re-tag (workflow_dispatch), no rebuild.
      - name: Move environment tags to the image
        env:
          SHA: ${{ needs.image.outputs.sha }}
          ENV_TAG: ${{ needs.image.outputs.env_tag }}
        run: |
          for img in "$IMAGE" "$DISCOVERY_IMAGE"; do
            docker buildx imagetools create --tag "$img:$ENV_TAG" "$img:$SHA"
            # latest always mirrors production (main)
            if [ "$ENV_TAG" = "prod" ]; then
              docker buildx imagetools create --tag "$img:latest" "$img:$SHA"
            fi
          done

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_TOKEN or COOLIFY_WEBHOOK is not set for this environment"; exit 1
          fi
          api_base="${COOLIFY_WEBHOOK%%/api/*}"

          call() { # METHOD URL -> body in /tmp/coolify.out, prints HTTP status
            curl --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 60 --retry 2 --retry-connrefused \
              --request "$1" --output /tmp/coolify.out --write-out '%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header "Accept: application/json" \
              "$2"
          }

          # Coolify answers 200 "Deployment already queued for this commit." and does NOT start a
          # new deployment while one is queued/running for the resource. A rollback or a quick
          # second push would then be swallowed, so we wait for the in-flight one and re-trigger.
          trigger() {
            code=$(call POST "$COOLIFY_WEBHOOK")
            echo "Coolify HTTP status: $code"
            head -c 500 /tmp/coolify.out; echo
            case "$code" in 2??) ;; *) exit 1 ;; esac
            dep_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' /tmp/coolify.out)
            dep_msg=$(jq -r '.deployments[0].message // empty' /tmp/coolify.out)
          }

          # Poll the deployment until it settles. Prints the final status and the log lines that
          # name the image. Returns 2 if the status cannot be read (token without read scope).
          wait_deploy() {
            for _ in $(seq 1 60); do
              c=$(call GET "$api_base/api/v1/deployments/$1")
              if [ "$c" != "200" ]; then echo "::warning::cannot read deployment $1 (HTTP $c)"; return 2; fi
              status=$(jq -r '.status // empty' /tmp/coolify.out)
              echo "deployment $1 status: $status"
              case "$status" in
                finished) jq -r '.logs // empty' /tmp/coolify.out | grep -iE 'image|digest|pull' | head -20 || true; return 0 ;;
                failed|cancelled*|error) return 1 ;;
              esac
              sleep 10
            done
            echo "Timed out waiting for deployment $1"; return 1
          }

          trigger
          if printf '%s' "$dep_msg" | grep -qi 'already queued'; then
            echo "A deployment was already in flight ($dep_uuid); waiting for it, then re-triggering so the current image tag is pulled."
            wait_deploy "$dep_uuid" || [ $? -eq 2 ] || true
            trigger
            if printf '%s' "$dep_msg" | grep -qi 'already queued'; then
              echo "Still deduplicated after waiting; failing so this is not reported as a successful deploy."; exit 1
            fi
          fi
          wait_deploy "$dep_uuid" || [ $? -eq 2 ]
          echo "Coolify redeploy finished (deployment $dep_uuid)"

      - name: Summary
        env:
          ENV_TAG: ${{ needs.image.outputs.env_tag }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          {
            echo "### Deploy triggered"
            echo "- Image tag: \`$ENV_TAG\`"
            echo "- Commit SHA: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
