name: Deploy

# staging branch -> Environment "staging"; main branch -> Environment "production"
# (required reviewer gate configured by the owner on the GitHub Environment).
# workflow_dispatch = rollback: re-tag an existing SHA image as the env tag and redeploy.
on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Full 40-char commit SHA of an already-built image to redeploy (rollback). Run from the branch of the target environment."
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DISCOVERY_IMAGE: ghcr.io/${{ github.repository }}/nasjod-discovery

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      env_tag: ${{ steps.vars.outputs.env_tag }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Compute tags
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          case "$REF_NAME" in
            staging) env_tag=staging ;;
            main) env_tag=prod ;;
            *) echo "Refusing to deploy from branch $REF_NAME"; exit 1 ;;
          esac
          sha="$COMMIT_SHA"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! printf '%s' "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "rollback_sha must be a full 40-char lowercase hex SHA"; exit 1
            fi
            sha="$ROLLBACK_SHA"
          fi
          echo "env_tag=$env_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out code
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Immutable tag only. Moving tags (staging/prod/latest) are set in the gated deploy job.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push discovery image
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: mosque_discovery
          file: mosque_discovery/Dockerfile
          push: true
          # Immutable tag only. Moving tags are set in the gated deploy job.
          tags: ${{ env.DISCOVERY_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs only after the environment gate. Fails if the :<sha> image does not exist.
      # Also serves as the rollback re-tag (workflow_dispatch), no rebuild.
      - name: Move environment tags to the image
        env:
          SHA: ${{ needs.image.outputs.sha }}
          ENV_TAG: ${{ needs.image.outputs.env_tag }}
        run: |
          for img in "$IMAGE" "$DISCOVERY_IMAGE"; do
            docker buildx imagetools create --tag "$img:$ENV_TAG" "$img:$SHA"
            # latest always mirrors production (main)
            if [ "$ENV_TAG" = "prod" ]; then
              docker buildx imagetools create --tag "$img:latest" "$img:$SHA"
            fi
          done

      - name: Trigger Coolify redeploy
        timeout-minutes: 25
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_TOKEN or COOLIFY_WEBHOOK is not set for this environment"; exit 1
          fi
          api_base="${COOLIFY_WEBHOOK%%/api/*}"
          out=$(mktemp)

          call() { # METHOD URL -> body in $out, prints HTTP status
            curl --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 60 --retry 2 --retry-connrefused \
              --request "$1" --output "$out" --write-out '%{http_code}' \
              --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header "Accept: application/json" \
              "$2" || echo 000
          }

          # Never print raw response bodies from the deployments API: they carry deployment logs
          # (env/build-arg values) and this repo is public. Only .message / uuid / status are shown.
          trigger() {
            code=$(call POST "$COOLIFY_WEBHOOK")
            echo "Coolify trigger HTTP status: $code"
            case "$code" in 2??) ;; *) echo "Coolify trigger failed"; exit 1 ;; esac
            dep_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' "$out")
            dep_msg=$(jq -r '.deployments[0].message // empty' "$out")
            res_uuid=$(jq -r '.deployments[0].resource_uuid // empty' "$out")
            echo "message: ${dep_msg:-<none>}"
            if [ -z "$dep_uuid" ]; then
              echo "Coolify response has no deployments[0].deployment_uuid (format changed?); failing."; exit 1
            fi
          }

          already_queued() { printf '%s' "$dep_msg" | grep -qi 'already queued'; }

          # Wait until no queued/in-progress deployment exists for this resource.
          # Returns 0 when idle, 1 on timeout, 2 when the token cannot read deployments.
          wait_idle() {
            for _ in $(seq 1 60); do
              c=$(call GET "$api_base/api/v1/deployments")
              case "$c" in
                200) ;;
                401|403) return 2 ;;
                *) echo "Reading in-flight deployments failed (HTTP $c)"; return 1 ;;
              esac
              # Items of this resource; if an item carries no resource field, count it too (safe: waits longer).
              n=$(jq --arg r "$res_uuid" '[.[]? | select((.application_uuid // .resource_uuid // $r) == $r)] | length' "$out")
              echo "in-flight deployments for resource: $n"
              [ "$n" = "0" ] && return 0
              sleep 10
            done
            echo "Timed out waiting for in-flight deployments"; return 1
          }

          # Poll one deployment to completion. 0 finished, 1 failed/timeout/unreadable, 2 token lacks read scope.
          wait_deploy() {
            for _ in $(seq 1 60); do
              c=$(call GET "$api_base/api/v1/deployments/$1")
              case "$c" in
                200) ;;
                401|403) return 2 ;;
                *) echo "Reading deployment $1 failed (HTTP $c)"; return 1 ;;
              esac
              status=$(jq -r '.status // empty' "$out")
              echo "deployment $1 status: ${status:-unknown}"
              case "$status" in
                finished) return 0 ;;
                failed|cancelled*|error) return 1 ;;
              esac
              sleep 10
            done
            echo "Timed out waiting for deployment $1"; return 1
          }

          trigger
          if already_queued; then
            # Coolify answers 200 "already queued" and starts nothing while a deployment is in
            # flight. The returned uuid is not a real deployment, so do not poll it: wait for the
            # resource's in-flight deployments, then trigger again so the current tag is pulled.
            echo "Deployment already in flight; waiting for it to finish, then re-triggering."
            wait_idle; rc=$?
            if [ $rc -eq 2 ]; then
              echo "::warning::Token cannot read deployments; cannot wait. Deployment was NOT verified."; exit 1
            elif [ $rc -ne 0 ]; then exit 1; fi
            trigger
            if already_queued; then
              echo "Still deduplicated after waiting; failing so this is not reported as a deploy."; exit 1
            fi
          fi

          wait_deploy "$dep_uuid"; rc=$?
          case $rc in
            0) echo "Coolify redeploy finished (deployment $dep_uuid)" ;;
            2) echo "::warning::Coolify redeploy accepted (NOT verified: COOLIFY_TOKEN lacks read scope)" ;;
            *) echo "Coolify deployment $dep_uuid did not finish successfully"; exit 1 ;;
          esac

      - name: Summary
        env:
          ENV_TAG: ${{ needs.image.outputs.env_tag }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          {
            echo "### Deploy triggered"
            echo "- Image tag: \`$ENV_TAG\`"
            echo "- Commit SHA: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
